version: '3'

services:

  kibana:
    image: jahrik/arm-kibana:arm32v7
    environment:
      ELASTICSEARCH_URL: "${ELASTICSEARCH_URL}"
    ports:
      - 5601:5601
    # volumes:
      # - /mnt/g1/kibana:/usr/share/kibana:rw
    networks:
      - traefik
    deploy:
      labels:
        traefik.docker.network: traefik
        traefik.backend: kibana
        traefik.port: 5601
        traefik.frontend.rule: Host:kibana.homelab.business
        traefik.frontend.entryPoints: http
        traefik.docker.network: traefik
      placement:
        constraints:
          - node.labels.arch == aarch64

networks:
  traefik:
    driver: overlay
    external: true
